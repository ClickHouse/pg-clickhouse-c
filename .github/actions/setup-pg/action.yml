name: Start Postgres
description: Install PostgreSQL from apt.postgresql.org and start a cluster

inputs:
  version:
    description: Major PostgreSQL version to install
    required: true
  port:
    description: Port for cluster
    default: '55432'

runs:
  using: composite
  steps:
    - name: Install and start PostgreSQL ${{ inputs.version }}
      shell: bash
      run: |
        set -euo pipefail
        # Script and repository key ship in pgdg postgresql-client-common, which
        # the runner image installs while dropping its pgdg apt source.
        # Installs postgresql-<v> and postgresql-server-dev-<v>
        sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh \
          -v ${{ inputs.version }} -i
        bin=/usr/lib/postgresql/${{ inputs.version }}/bin
        data=$RUNNER_TEMP/pgdata
        # Own cluster rather than pg_createcluster: backends write coverage
        # counters beside the objects, which asks that the server run as the
        # user owning the checkout. trust auth lets tests connect as postgres,
        # superuser needed to load C module
        "$bin/initdb" -D "$data" -A trust -U postgres
        # Socket only, the runner image preinstalls a cluster on 5432
        "$bin/pg_ctl" -D "$data" -l "$data/server.log" \
          -o "-p ${{ inputs.port }} -k $data -c listen_addresses=''" start
        echo "$bin" >> "$GITHUB_PATH"
        {
          echo "PGHOST=$data"
          echo 'PGPORT=${{ inputs.port }}'
          echo 'PGUSER=postgres'
          echo "PG_CONFIG=$bin/pg_config"
        } >> "$GITHUB_ENV"
